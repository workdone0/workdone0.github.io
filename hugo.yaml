baseURL: "https://workdone0.github.io/"
languageCode: en-us
title: Shubham's Space
theme: ["PaperMod"]

params:
  homeInfoParams:
    Title: 'नमस्ते'
    Content: |
      A little about me—I’m a Software Engineer who builds scalable, reliable apps—basically, I make sure things don’t crash (often). When I’m not coding, I’m geeking out over space, history, bikes, music, and yelling at cricket matches. Always learning, always curious, occasionally funny.
    ReadMoreLink: "/about/"
    ReadMoreText: "Read more..."

  socialIcons:
    - name: github
      url: https://github.com/workdone0
    - name: linkedin
      url: https://www.linkedin.com/in/shubham-kumar-0199/
  
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: workdone0
  description: "workdone0 portfolio/blog site"
  keywords: [Blog, Portfolio, workdone0]
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

menu:
  main:
    - identifier: about
      name: about
      url: /about/
      weight: 10
    - identifier: archives
      name: archives
      url: /archives/
      weight: 20
    - identifier: categories
      name: categories
      url: /categories/
      weight: 30

caches:
  images:
    dir: :cacheDir/images
